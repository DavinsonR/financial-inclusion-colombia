name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Relanzar la cadena a mano, sin un commit de codigo.
  workflow_dispatch:

env:
  IIF_ROOT: ${{ github.workspace }}
  IIF_DUCKDB_PATH: /tmp/iif.duckdb

jobs:
  check:
    name: Lint, pruebas, dbt (DuckDB) y sitio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependencias
        run: uv sync --all-groups --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Pruebas (sin datos crudos)
        run: uv run pytest -q -m "not data"

      - name: dbt en DuckDB
        run: |
          uv run dbt deps --profiles-dir dbt --project-dir dbt
          uv run dbt seed --profiles-dir dbt --project-dir dbt
          uv run dbt build --profiles-dir dbt --project-dir dbt

      # La cadena entera del CLI sobre el almacen recien construido. Corre antes que las pruebas con datos
      # porque un fallo aqui es de comando (rutas, codificacion, dependencias) y se lee mejor solo.
      - name: El indice y la bateria corren de punta a punta
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run iif index
          uv run iif econ
          uv run iif curva

      # Incluye tests/test_resultados_publicados.py, que regenera la bateria y la compara cifra a cifra
      # contra data/processed/econ/resultados.json. Es lo que convierte R-09 de promesa en garantia: si el
      # codigo y el numero publicado se separan, el flujo se pone en rojo (ADR-018).
      - name: Pruebas con datos crudos y reproduccion de las cifras publicadas
        run: uv run pytest -q -m data

      # Si la corrida anterior cambio una cifra publicada, el arbol queda sucio y hay que regenerar y
      # commitear a proposito, no descubrirlo en una lectura.
      - name: El arbol no cambia al regenerar
        run: git diff --stat -- data/processed ':!data/processed/econ/resultados.json' && git diff --quiet -- data/processed ':!data/processed/econ/resultados.json'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.7.32"

      - name: Kernel de Jupyter
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python (iif)"

      - name: Render del sitio
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render

      # El sitio ya no se publica: queda como artefacto, que es donde se mira cuando hace falta.
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: _site


  bigquery:
    name: dbt en BigQuery (solo con credenciales)
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay credenciales?
        id: creds
        run: echo "ok=${{ secrets.BIGQUERY_PROJECT != '' }}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Clave de servicio
        if: steps.creds.outputs.ok == 'true'
        run: |
          printf '%s' "${{ secrets.BIGQUERY_KEYFILE_JSON }}" > "$RUNNER_TEMP/bq.json"
          echo "BIGQUERY_KEYFILE=$RUNNER_TEMP/bq.json" >> "$GITHUB_ENV"
      - name: dbt build --target bigquery
        if: steps.creds.outputs.ok == 'true'
        env:
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
          BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
        run: |
          uv sync --all-groups
          uv run dbt deps --profiles-dir dbt --project-dir dbt
          uv run dbt build --profiles-dir dbt --project-dir dbt --target bigquery
      - name: Sin credenciales
        if: steps.creds.outputs.ok != 'true'
        run: echo "Sin BIGQUERY_PROJECT, se omite el objetivo bigquery (ADR-014)."
