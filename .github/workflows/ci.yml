name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IIF_ROOT: ${{ github.workspace }}
  IIF_DUCKDB_PATH: /tmp/iif.duckdb

jobs:
  check:
    name: Lint, pruebas, dbt (DuckDB) y sitio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependencias
        run: uv sync --all-groups --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Pruebas (sin datos crudos)
        run: uv run pytest -q -m "not data"

      - name: dbt en DuckDB
        run: |
          uv run dbt deps --profiles-dir dbt --project-dir dbt
          uv run dbt seed --profiles-dir dbt --project-dir dbt
          uv run dbt build --profiles-dir dbt --project-dir dbt

      - name: Pruebas con datos crudos
        run: uv run pytest -q -m data

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.7.32"

      - name: Kernel de Jupyter
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python (iif)"

      - name: Render del sitio
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render

      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: _site

  snowflake:
    name: dbt en Snowflake (solo con secrets)
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay credenciales?
        id: creds
        run: echo "ok=${{ secrets.SNOWFLAKE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
      - name: dbt build --target snowflake
        if: steps.creds.outputs.ok == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          uv sync --all-groups
          uv run dbt deps --profiles-dir dbt --project-dir dbt
          uv run dbt build --profiles-dir dbt --project-dir dbt --target snowflake
      - name: Sin credenciales
        if: steps.creds.outputs.ok != 'true'
        run: echo "Sin SNOWFLAKE_ACCOUNT, se omite el objetivo snowflake (ADR-014)."
