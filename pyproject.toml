[project]
name = "iif-colombia"
version = "0.1.0"
description = "Inclusión financiera y crecimiento regional en Colombia: datos, índice, econometría y atlas reproducibles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Davirson Novoa Ramírez" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=17",
  "duckdb>=1.1",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
  "dbt-bigquery>=1.9",
  "dbt-snowflake>=1.9",
  "pandera>=0.20",
  "linearmodels>=6.0",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "factor-analyzer>=0.5",
  "openpyxl>=3.1",
  "requests>=2.32",
  "pyyaml>=6.0",
  "great-tables>=0.13",
  "matplotlib>=3.9",
  "nbformat>=5.10",
  "typer>=0.12",
]

[project.optional-dependencies]
geo = ["topojson>=1.9", "shapely>=2.0"]
site = ["jupyter>=1.1", "ipykernel>=6.29", "nbclient>=0.10", "tabulate>=0.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "responses>=0.25"]

[project.scripts]
iif = "iif.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iif"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", "_freeze", "_site", ".quarto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer exige llamadas en los valores por defecto de los parámetros de la CLI
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: pruebas que requieren datos crudos descargados (se saltan si no existen)"]
addopts = "-q"
