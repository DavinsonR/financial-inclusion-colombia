# Contrato de datos del atlas (ADR-005). Todo lo que el mapa muestra sale de aquí; el navegador no
# consulta ninguna base de datos. Presupuesto total de `atlas/data/`: 3 MB.

version: 1
presupuesto_mb: 3.0

# El grupo `proyeccion` no sale del warehouse: son años que todavía no existen en ningún
# mart. Se adjunta desde `data/processed/forecast/resultados.json`, que produce
# `uv run iif forecast`. Si ese archivo falta, el atlas se exporta sin la capa; si está
# pero le falta el ancho del intervalo, la exportación falla (ADR-022 decisión 6).
proyeccion:
  origen: data/processed/forecast/resultados.json
  nivel: departamento

# Geometría del MGN 2024 a TopoJSON, servida con extensión .json para que Quarto la copie al sitio.
# Geometría del MGN 2024 a TopoJSON. `simplificacion` en grados: 0,002 son unos 220 m y 0,003 unos 330 m.
# Comprobado que a estas tolerancias no se pierde ninguna unidad (33 y 1.121).
geometria:
  departamentos:
    origen: data/raw/mgn/departamentos.geojson
    clave: dpto_ccdgo
    cuantizacion: 100000
    simplificacion: 0.002
  municipios:
    origen: data/raw/mgn/municipios.geojson
    clave: mpio_cdpmp
    cuantizacion: 100000
    simplificacion: 0.003

# Indicadores que viajan al navegador. `escala` dice cómo colorear: `secuencial` de menos a más,
# `divergente` alrededor de cero. `decimales` controla el redondeo, que es lo que fija el tamaño.
indicadores:
  departamento:
    - id: iif_compuesto
      etiqueta: "Índice compuesto"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: iif_acceso
      etiqueta: "Acceso"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: iif_uso
      etiqueta: "Uso"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: iif_profundidad
      etiqueta: "Profundidad"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: nro_corresp_activos
      etiqueta: "Corresponsales activos por 10.000 habitantes"
      grupo: variable
      escala: secuencial
      decimales: 2
    - id: nro_total
      etiqueta: "Transacciones en corresponsales por 10.000 habitantes"
      grupo: variable
      escala: secuencial
      decimales: 0
    - id: monto_total
      etiqueta: "Monto transado en corresponsales, % del PIB"
      grupo: variable
      escala: secuencial
      decimales: 2
    - id: nro_total_cta_ahorros
      etiqueta: "Cuentas de ahorro por 10.000 habitantes"
      grupo: variable
      escala: secuencial
      decimales: 0
    - id: saldo_total_cta_ahorros
      etiqueta: "Saldo en cuentas de ahorro, % del PIB"
      grupo: variable
      escala: secuencial
      decimales: 2
    - id: monto_total_cred_consumo
      etiqueta: "Crédito de consumo, % del PIB"
      grupo: variable
      escala: secuencial
      decimales: 2
    - id: monto_total_cred_vivienda
      etiqueta: "Crédito de vivienda, % del PIB"
      grupo: variable
      escala: secuencial
      decimales: 2
    - id: monto_total_micro
      etiqueta: "Microcrédito, % del PIB"
      grupo: variable
      escala: secuencial
      decimales: 2
    - id: pib_real_per_capita
      etiqueta: "PIB real por habitante"
      grupo: contexto
      escala: secuencial
      decimales: 0
    - id: crecimiento_pib_real_pc
      etiqueta: "Crecimiento del PIB real por habitante"
      grupo: contexto
      escala: divergente
      decimales: 4
    - id: poblacion_total
      etiqueta: "Población"
      grupo: contexto
      escala: secuencial
      decimales: 0
    # Proyección 2026-2028 (ADR-019 a ADR-022). Los años proyectados van marcados en
    # `anios_proyectados` dentro de `series_departamento.json`, y el ancho del intervalo
    # viaja como indicador propio: el tamaño del departamento no predice su incertidumbre
    # (Spearman -0,358), así que ninguna heurística del navegador puede sustituirlo.
    - id: crecimiento_pib_real_proy
      etiqueta: "Crecimiento proyectado del PIB real"
      grupo: proyeccion
      escala: divergente
      decimales: 2
    - id: crecimiento_pib_real_pc_proy
      etiqueta: "Crecimiento proyectado por habitante"
      grupo: proyeccion
      escala: divergente
      decimales: 2
    - id: crecimiento_pib_real_proy_sin_anclar
      etiqueta: "Crecimiento proyectado, sin anclar al consenso"
      grupo: proyeccion
      escala: divergente
      decimales: 2
    - id: intervalo_ancho_proy
      etiqueta: "Ancho del intervalo al 80 %"
      grupo: proyeccion
      escala: secuencial
      decimales: 1
  # A nivel municipal solo viajan el índice y el contexto mínimo: 1.123 unidades por 7 años multiplican
  # cada indicador por 7.861 números, y el presupuesto manda.
  municipio:
    - id: iif_compuesto
      etiqueta: "Índice compuesto"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: iif_acceso
      etiqueta: "Acceso"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: iif_uso
      etiqueta: "Uso"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: iif_profundidad
      etiqueta: "Profundidad"
      grupo: indice
      escala: divergente
      decimales: 3
    - id: va_per_capita_corriente
      etiqueta: "Valor agregado por habitante"
      grupo: contexto
      escala: secuencial
      decimales: 0
    - id: poblacion_total
      etiqueta: "Población"
      grupo: contexto
      escala: secuencial
      decimales: 0
