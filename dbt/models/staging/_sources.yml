version: 2

# Fuentes crudas del almacén. En DuckDB se leen con read_parquet() desde el repositorio vía
# `meta.external_location` (dbt-duckdb); `{name}` es el nombre de la tabla. En BigQuery las mismas tablas
# viven en los datasets `raw` e `interim` tras `bash bigquery/01_load_parquet.sh`, y en Snowflake en
# IIF.RAW e IIF.INTERIM tras COPY INTO; en ambos casos `external_location` se ignora.
# IIF_ROOT apunta a la raíz del repositorio; dbt corre desde dbt/, de ahí el '..' por defecto.
# Descargas: data/raw/<fuente_id>/anio=YYYY/part-0.parquet (config/sources.yaml, manifest.jsonl).
# Parseados: data/interim/{dane,mgn}/<tabla>.parquet (`iif parse dane`, `iif parse mgn`).
sources:
  - name: sfc
    description: "Superintendencia Financiera de Colombia vía API SODA de datos.gov.co (CC BY-SA 4.0)."
    schema: raw
    meta:
      external_location: "{{ env_var('IIF_ROOT', '..') }}/data/raw/{name}/anio=*/part-0.parquet"
    tables:
      - name: sfc_ptgf_ywrb
        description: "Inclusión financiera (legado): entidad × municipio × bloque `tipo`, trimestral 2017Q4 a 2021Q1, 603.232 filas. unicap 1-33 departamentos, 34-40 bloques no geográficos; `renglon` = código municipal DIVIPOLA (999 = total departamental, S-009)."
      - name: sfc_kx2f_xjdq
        description: "Inclusión financiera (vigente): entidad × municipio × bloque, trimestral 2021Q1 a 2025Q4, 99 columnas; `tipo` con tres grafías de 'Corresponsales físicos'; ceros no nulos."
      - name: sfc_vkbt_desu
        description: "Puntos de atención de canales por municipio (DIVIPOLA de 5 dígitos), entidad × municipio × canal, mensual 2023-01 en adelante."

  - name: mintic
    description: "Ministerio TIC vía API SODA (CC BY-SA 4.0)."
    schema: raw
    meta:
      external_location: "{{ env_var('IIF_ROOT', '..') }}/data/raw/{name}/anio=*/part-0.parquet"
    tables:
      - name: mintic_n48w_gutb
        description: "Internet fijo por municipio (DIVIPOLA) y proveedor, trimestral 2016Q1 a 2023Q3 (2,8 M filas); abandonado en 2024."

  - name: men
    description: "Ministerio de Educación Nacional vía API SODA (CC BY-SA 4.0)."
    schema: raw
    meta:
      external_location: "{{ env_var('IIF_ROOT', '..') }}/data/raw/{name}/anio=*/part-0.parquet"
    tables:
      - name: men_nudc_7mev
        description: "Estadísticas de educación por municipio (DIVIPOLA), anual 2011 a 2024; ceros = faltantes (R-13); quiebre metodológico en 2018."

  - name: dane
    description: "DANE: cuentas departamentales, valor agregado municipal, proyecciones de población e ITAED; XLSX con fecha Last-Modified convertidos a Parquet tidy por `iif parse dane`."
    schema: interim
    meta:
      external_location: "{{ env_var('IIF_ROOT', '..') }}/data/interim/dane/{name}.parquet"
    tables:
      - name: pib_departamento_anual
        description: "PIB por departamento 2005 a 2025pr: corriente, constante 2015 y per cápita, con estado_dato; dpto_ccdgo 00 = Colombia."
      - name: va_departamento_actividad_anual
        description: "Valor agregado por departamento y actividad económica (secciones CIIU), corriente y constante 2015."
      - name: va_municipio_anual
        description: "Valor agregado municipal 2011 a 2024p (distribución del PIB departamental, nominal) con actividades primarias, secundarias, terciarias y peso relativo."
      - name: poblacion_departamento_anual
        description: "Proyecciones de población departamental por área 2018 a 2050 (_VP)."
      - name: poblacion_municipio_anual
        description: "Población municipal por área: retroproyección 2005 a 2017 y proyección 2018 a 2042 (_VP)."
      - name: itaed_departamento_trimestre
        description: "Índice trimestral de actividad económica departamental (base 2015): 13 departamentos, Bogotá, Colombia (00) y Resto."

  - name: mgn
    description: "DANE Marco Geoestadístico Nacional 2024 (FeatureServer ArcGIS), atributos a Parquet por `iif parse mgn`; la geometría queda en data/raw/mgn/*.geojson."
    schema: interim
    meta:
      external_location: "{{ env_var('IIF_ROOT', '..') }}/data/interim/mgn/{name}.parquet"
    tables:
      - name: departamentos
        description: "33 departamentos: dpto_ccdgo, nombre, área."
      - name: municipios
        description: "1.121 municipios, áreas no municipalizadas e isla: mpio_ccdgo (5 dígitos), tipo, área."

  - name: indice
    description: "Índice de inclusión financiera calculado por `uv run iif index` (ADR-015) y escrito como Parquet en data/processed/. No lo produce dbt: el ajuste vive en Python porque necesita PCA y estandarización con pesos congelados."
    schema: processed
    meta:
      external_location: "{{ env_var('IIF_ROOT', '..') }}/data/processed/{name}.parquet"
    tables:
      - name: indice_departamento_anual
        description: "Subíndices de acceso, uso y profundidad, compuesto y las dos versiones de sensibilidad, por departamento y año."
      - name: indice_municipio_anual
        description: "Lo mismo por municipio y año, con los pesos calibrados en el panel departamental para que las dos escalas sean comparables."
